server:
  port: 8082

spring:
  application:
    name: mall-product
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall_product?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root123
  redis:
    host: localhost
    port: 6379
    password:

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.common.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

dubbo:
  application:
    name: mall-product-dubbo
  protocol:
    name: dubbo
    port: 20882
  registry:
    address: nacos://localhost:8848
  scan:
    base-packages: com.mall.product.rpc

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: default_tx_group
  enable-auto-data-source-proxy: true
  registry:
    type: nacos
    nacos:
      server-addr: localhost:8848
      application: seata-server
      group: DEFAULT_GROUP
  config:
    type: file
  service:
    vgroupMapping:
      default_tx_group: default
    default:
      grouplist: localhost:8091
