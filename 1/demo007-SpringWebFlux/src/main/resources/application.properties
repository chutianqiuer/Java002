# Spring Boot 应用配置
spring.application.name=demo007-SpringWebFlux

# 服务端口
server.port=8080

# 日志配置
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.reactor.netty=WARN

# Reactor调试模式（生产环境建议关闭）
reactor.netty.pool.maxConnections=500
reactor.netty.pool.maxIdleTime=60s

# Spring WebFlux特定配置
spring.webflux.urls=/api/**,/functional/**

# 关闭Spring MVC的自动配置（纯WebFlux项目）
# spring.main.web-application-type=reactive
