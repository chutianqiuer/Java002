# ===================================================================
# Spring Boot 配置文件
# ===================================================================
#
# 【配置文件说明】
# 本文件用于配置Spring Boot应用程序的各种参数
# 包括缓存配置、日志配置、数据源配置等
#
# 【配置优先级】
# 命令行参数 > 环境变量 > application.properties > application.yml
#
# 【缓存相关配置】
# spring.cache.cache-names：预定义的缓存名称列表
# spring.cache.caffeine.spec：Caffeine缓存配置
# spring.cache.ehcache.config：EhCache配置文件位置
#
# ===================================================================

# ===================================================================
# 应用程序基本配置
# ===================================================================

# 应用名称
spring.application.name=demo009-SpringCache

# 应用端口
server.port=8080

# 服务横幅关闭（减少启动日志）
spring.main.banner-mode=console

# ===================================================================
# Spring Cache缓存配置
# ===================================================================

# 预定义的缓存名称列表（逗号分隔）
# 【作用】
# - 预定义缓存后，即使没有使用@Cacheable也会创建缓存
# - 可以配合early-put属性实现缓存预热
# - 让开发者明确知道系统中会有哪些缓存
# 【注意】
# 如果使用@Cacheable时指定的cacheNames不在这个列表中，
# Spring会自动创建对应的缓存，不需要预先定义
spring.cache.cache-names=users,products,userDetail,userIndex,userList,productInfo

# ===================================================================
# Caffeine缓存配置
# ===================================================================

# Caffeine缓存规格配置
# 【配置参数说明】
# - maximumSize：最大缓存条目数
# - maximumWeight：最大缓存权重
# - expireAfterWrite：写入后过期时间
# - expireAfterAccess：访问后过期时间
# - refreshAfterWrite：写入后刷新时间（异步）
# - recordStats：记录统计信息
#
# 【语法格式】
# key: value, key: value
#
# 【示例】
# spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=600s
# spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=300s,recordStats
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30s,recordStats

# ===================================================================
# EhCache缓存配置
# ===================================================================

# EhCache配置文件位置
# 【说明】
# - 相对于classpath的路径
# - 支持classpath:、file:等前缀
spring.cache.ehcache.config=classpath:ehcache.xml

# ===================================================================
# JCache配置
# ===================================================================

# JCache配置文件位置（可选）
# 如果使用JCache标准的配置方式
# spring.cache.jcache.config=classpath:ehcache.xml

# JCache provider类名（可选）
# 如果系统有多个JCache实现，需要指定使用哪个
# spring.cache.jcache.provider=org.ehcache.jsr107.EhcacheCachingProvider

# ===================================================================
# 日志配置
# ===================================================================

# 日志级别配置
# 【说明】
# - logging.level.root：根日志级别
# - logging.level.xxx：特定包的日志级别
# - 级别：TRACE < DEBUG < INFO < WARN < ERROR
logging.level.root=INFO

# Spring Cache日志（开启DEBUG可以看到缓存操作详情）
logging.level.org.springframework.cache=DEBUG

# Caffeine日志
logging.level.com.github.benmanes.caffeine=WARN

# EhCache日志
logging.level.org.ehcache=WARN

# ===================================================================
# 其他配置（可选）
# ===================================================================

# 是否允许缓存null值
# 【说明】
# - true：允许缓存null值，@Cacheable会缓存null结果
# - false：不允许缓存null值，@Cacheable不会缓存null结果
# 【建议】
# - 设置为false可以避免缓存穿透问题
# - 但更好的方案是使用unless="#result == null"来控制
# spring.cache.null-values=false

# 缓存键生成器
# 【说明】
# 指定自定义的KeyGenerator bean名称
# 默认使用SimpleKeyGenerator
# spring.cache.key-generator=

# ===================================================================
# 测试模式配置
# ===================================================================

# 调试模式
debug=false

# 跟踪模式
trace=false
