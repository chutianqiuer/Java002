# Spring Context Demo 应用程序配置文件
# 此文件用于配置应用程序级别的属性

# 应用程序名称
app.name=Spring Context Demo

# 当前激活的环境profile
spring.profiles.active=dev

# 数据库配置（示例）
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/demo
db.username=root
db.password=password

# 开发环境配置
db.dev.url=jdbc:h2:mem:devdb
db.dev.username=sa
db.dev.password=

# 生产环境配置
db.prod.url=jdbc:mysql://prod-server:3306/demo
db.prod.username=prod_user
db.prod.password=prod_password

# 消息配置
app.welcome.message=欢迎学习Spring Context
app.version=1.0

# 资源路径配置
app.resource.path=/resources/

# 日志级别
logging.level.com.example=DEBUG
logging.level.org.springframework=INFO
