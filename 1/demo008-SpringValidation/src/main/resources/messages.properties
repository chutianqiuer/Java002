# ============================================
# Spring Validation 错误消息国际化配置
# ============================================
#
# 为什么需要自定义错误消息？
# 默认的错误消息比较简单，如"不能为null"、"长度必须在{min}和{max}之间"等。
# 自定义错误消息可以更详细、更友好，并且支持中文显示。
#
# 如何使用？
# 1. 在 @NotNull、@NotBlank 等注解中指定 message = "{key}"
# 2. 在 messages.properties 中定义 key=消息内容
# 3. Spring 会自动从 messages.properties 中查找对应的消息
#
# 消息模板语法：
# {0}, {1}, {2}... - 引用参数，按顺序替换
# {min}, {max} - 内置变量，由校验注解提供
# {validatedValue} - 被校验的值
#
# 注意：
# - 文件名必须是 messages.properties（Spring 默认）
# - 如果需要支持其他语言，创建 messages_zh_CN.properties 等
# - 默认的 messages.properties 是英文的

# ============================================
# 不能为空相关消息
# ============================================

# 不能为空
javax.validation.constraints.NotNull.message=此字段不能为空

# 不能为空字符串（不会去除空白）
javax.validation.constraints.NotBlank.message=此字段不能为空且不能包含空白字符

# 不能为空（集合、数组、字符串）
javax.validation.constraints.NotEmpty.message=此字段不能为空

# ============================================
# 长度相关消息
# ============================================

# 长度限制
javax.validation.constraints.Size.message=长度必须在{min}到{max}个字符之间

# Hibernate Validator 特有
org.hibernate.validator.constraints.Length.message=长度必须在{min}到{max}个字符之间

# ============================================
# 数值范围相关消息
# ============================================

# 最小值（整数）
javax.validation.constraints.Min.message=值必须大于或等于{value}

# 最大值（整数）
javax.validation.constraints.Max.message=值必须小于或等于{value}

# 最小值（支持小数）
javax.validation.constraints.DecimalMin.message=值必须大于或等于{value}

# 最大值（支持小数）
javax.validation.constraints.DecimalMax.message=值必须小于或等于{value}

# 正数
javax.validation.constraints.Positive.message=值必须是正数

# 正数或零
javax.validation.constraints.PositiveOrZero.message=值必须大于或等于零

# 负数
javax.validation.constraints.Negative.message=值必须是负数

# 负数或零
javax.validation.constraints.NegativeOrZero.message=值必须小于或等于零

# 数字格式（整数和小数部分位数）
javax.validation.constraints.Digits.message=数字格式不正确，整数部分最多{integer}位，小数部分最多{fraction}位

# ============================================
# 格式相关消息
# ============================================

# 邮箱格式
javax.validation.constraints.Email.message=邮箱格式不正确

# 正则表达式
javax.validation.constraints.Pattern.message=格式不符合要求

# URL 格式（如果使用了 @URL 注解）
org.hibernate.validator.constraints.URL.message=URL 格式不正确

# ============================================
# 日期相关消息
# ============================================

# 必须是过去的日期
javax.validation.constraints.Past.message=日期必须是过去的时间

# 必须是未来的日期
javax.validation.constraints.Future.message=日期必须是未来的时间

# 必须是过去或现在的日期
javax.validation.constraints.PastOrPresent.message=日期必须是过去或现在的时间

# 必须是未来或现在的日期
javax.validation.constraints.FutureOrPresent.message=日期必须是现在或未来的时间

# ============================================
# 布尔相关消息
# ============================================

# 必须为 true
javax.validation.constraints.AssertTrue.message=此字段必须为 true

# 必须为 false
javax.validation.constraints.AssertFalse.message=此字段必须为 false

# ============================================
# 自定义校验消息
# ============================================

# 自定义校验器默认消息
com.example.validator.CustomValidator.message=校验失败

# ============================================
# Hibernate Validator 特有消息
# ============================================

# 信用卡号格式
org.hibernate.validator.constraints.CreditCardNumber.message=信用卡号格式不正确

#  EAN-13 条形码
org.hibernate.validator.constraints.EAN.message=条形码格式不正确

# ISBN
org.hibernate.validator.constraints.ISBN.message=ISBN 格式不正确

#  ScriptAssert（脚本表达式）
org.hibernate.validator.constraints.ScriptAssert.message=脚本表达式校验失败

# ============================================
# 错误消息示例（带参数替换）
# ============================================

# 带参数的消息示例（如果需要更详细的控制，可以在注解中直接指定）
# @NotBlank(message = "用户名{message}") 配合 messages.properties
# not.blank.message=不能为空，请输入用户名

# ============================================
# 分组校验相关
# ============================================

# 分组校验时，如果需要针对特定分组定义消息
# 可以使用分组接口的全限定名作为前缀
# com.example.model.RegisterRequest.CreateGroup.message=创建时校验消息

# ============================================
# 通用消息模板
# ============================================

# 默认消息（当找不到特定消息时使用）
# javax.validation.constraints.message=校验失败

# ============================================
# 中文友好消息（直接指定在注解中）
# ============================================
# 以下是一些常用的中文消息模板，可以在 @NotNull 等注解中直接使用
# message = "用户名不能为空"
# message = "邮箱格式不正确，例如：example@example.com"
# message = "密码长度必须在6-20位之间"
# message = "手机号必须是11位数字，以1开头"
# message = "年龄必须在0-150岁之间"
# message = "出生日期必须是过去的日期"
# message = "预约日期必须是未来的日期"
