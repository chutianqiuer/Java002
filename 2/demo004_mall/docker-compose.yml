version: '3.8'

services:
  # MySQL 8.0 - Main database
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - mall-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7.0
  redis:
    image: redis:7-alpine
    container_name: mall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mall-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nacos - standalone embedded mode
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: mall-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: ""
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - mall-network

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:4.9.5
    container_name: mall-rocketmq-namesrv
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
      TZ: Asia/Shanghai
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-data:/home/rocketmq/namesrv/logs
      - rocketmq-namesrv-store:/home/rocketmq/namesrv/store
    networks:
      - mall-network
    command: sh mqnamesrv

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:4.9.5
    container_name: mall-rocketmq-broker
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: "-Xms1g -Xmx1g -Xmn512m"
      TZ: Asia/Shanghai
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - rocketmq-broker-data:/home/rocketmq/broker/logs
      - rocketmq-broker-store:/home/rocketmq/broker/store
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf
    networks:
      - mall-network
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf

  # Seata Server
  seata-server:
    image: seataio/seata-server:1.7.0
    container_name: mall-seata-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      STORE_MODE: file
      SEATA_IP: 0.0.0.0
      SEATA_PORT: 8091
      SEATA_REGISTRY_TYPE: nacos
      SEATA_REGISTRY_NAcos_SERVER_ADDR: nacos
      SEATA_REGISTRY_NAcos_SERVER_PORT: 8848
      SEATA_REGISTRY_NAcos_APPLICATION: seata-server
      SEATA_REGISTRY_NAcos_GROUP: DEFAULT_GROUP
      SEATA_REGISTRY_NAcos_NAMESPACE: ""
      SEATA_REGISTRY_NAcos_CLUSTER: default
      SEATA_CONFIG_TYPE: file
    ports:
      - "8091:8091"
      - "7091:7091"
    volumes:
      - ./seata/registry.conf:/seata-server/resources/registry.conf
      - ./seata/file.conf:/seata-server/resources/file.conf
      - seata-data:/seata-server/logs
    networks:
      - mall-network
    depends_on:
      - nacos

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
  rocketmq-namesrv-data:
  rocketmq-namesrv-store:
  rocketmq-broker-data:
  rocketmq-broker-store:
  seata-data:

networks:
  mall-network:
    name: mall-network
    driver: bridge
